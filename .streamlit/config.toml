[theme]
base = "dark"
primaryColor = "#20D68A"
backgroundColor = "#090B0F"
secondaryBackgroundColor = "#151922"
textColor = "#FFFFFF"
font = "sans serif"

[client]
# Navigation is rendered by MNZ BOT itself (sidebar on desktop, bottom bar on mobile).
showSidebarNavigation = false
toolbarMode = "minimal"

[server]
headless = true
address = "0.0.0.0"
port = 8501
enableCORS = false
